<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3e241e" />
  <meta name="description" content="Ретро-открытка приглашение на спектакль" />
  <title>Письмо о далёком будущем — 18 ноября</title>
  <style>
    :root {
      --ink: #2f1d19;
      --brown: #6f4a3e;
      --rose: #9d4d5c;
      --rose-soft: #c9939d;
      --paper: rgba(252, 245, 234, 0.72);
      --paper-strong: rgba(250, 241, 228, 0.98);
      --line: rgba(111, 74, 62, 0.16);
      --shadow: 0 22px 80px rgba(18, 9, 7, 0.28);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: #1d1310;
      overflow-x: hidden;
    }
    button, input, textarea { font: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(255,255,255,.9);
      outline-offset: 3px;
    }
    .cinema-bg {
      position: fixed;
      inset: 0;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      filter: saturate(.95) sepia(.08);
      transform: scale(1.04);
      transition: background-image .5s ease;
    }
    .cinema-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(19, 10, 9, .30), rgba(19, 10, 9, .33)),
        radial-gradient(circle at center, rgba(255,255,255,.06), transparent 46%),
        repeating-linear-gradient(to bottom, rgba(255,255,255,.035), rgba(255,255,255,.035) 2px, transparent 2px, transparent 4px);
      backdrop-filter: none;
    }
    .cinema-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,.07) 0.7px, transparent 0.7px);
      background-size: 3px 3px;
      opacity: .22;
      mix-blend-mode: screen;
      pointer-events: none;
    }
    .layout {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px 36px;
    }
    .shell {
      width: min(100%, 560px);
      position: relative;
    }
    .shell.final-wide { width: min(100%, 950px); }
    .shell.final-wide .paper { padding: clamp(18px, 3.2vw, 34px); }
    .shell.final-wide .canvas-wrap { padding: clamp(5px, 1.8vw, 14px); }
    .paper {
      position: relative;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid rgba(255,255,255,.55);
      box-shadow: var(--shadow);
      border-radius: 28px;
      padding: clamp(22px, 3.8vw, 34px);
      backdrop-filter: blur(2px) saturate(115%);
    }
    .paper::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 20px;
      border: 1px solid rgba(111,74,62,.14);
      pointer-events: none;
    }
    .paper::after {
      content: "";
      position: absolute;
      top: -70px;
      right: -50px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(201,147,157,.28), transparent 67%);
      pointer-events: none;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
      color: rgba(47,29,25,.72);
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .music-btn {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 5;
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(26, 14, 12, .48);
      color: #fff8f0;
      backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 12px 28px rgba(0,0,0,.18);
    }
    .music-btn:hover { background: rgba(26,14,12,.62); }
    .progress {
      height: 7px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(111,74,62,.12);
      margin-bottom: 22px;
    }
    .progress > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #84534a, #b56d7d);
      width: 0%;
      transition: width .25s ease;
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(28px, 5.6vw, 44px); line-height: 1.12; margin-bottom: 10px; }
    h2 { font-size: clamp(24px, 4.8vw, 34px); line-height: 1.16; margin-bottom: 10px; }
    .subtitle { color: rgba(47,29,25,.78); font-size: 17px; line-height: 1.65; max-width: 580px; }
    .eyebrow {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 7px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
      color: var(--rose);
      background: rgba(157,77,92,.08);
      border: 1px solid rgba(157,77,92,.12);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .question-art {
      width: 86px;
      height: 86px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      font-size: 42px;
      background: linear-gradient(180deg, rgba(255,255,255,.56), rgba(255,255,255,.28));
      border: 1px solid rgba(111,74,62,.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
      margin: 0 0 18px;
    }
    .choices {
      display: grid;
      gap: 12px;
      margin-top: 22px;
    }
    .choice {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      border: 1px solid rgba(111,74,62,.16);
      background: rgba(255,255,255,.30);
      color: var(--ink);
      border-radius: 18px;
      padding: 16px 16px;
      cursor: pointer;
      text-align: left;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }
    .choice:hover { transform: translateY(-1px); background: rgba(255,255,255,.48); }
    .choice.active {
      background: rgba(255,245,245,.70);
      border-color: rgba(157,77,92,.42);
      box-shadow: 0 0 0 3px rgba(157,77,92,.08);
    }
    .emoji {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(157,77,92,.08);
      flex: none;
      font-size: 24px;
    }
    .choice-title { font-size: 18px; font-weight: 700; }
    .choice-sub { font-size: 13px; color: rgba(47,29,25,.68); margin-top: 3px; line-height: 1.45; }
    .check {
      margin-left: auto;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(111,74,62,.22);
      display: grid;
      place-items: center;
      font-size: 14px;
      color: transparent;
      flex: none;
    }
    .choice.active .check {
      color: white;
      border-color: var(--rose);
      background: var(--rose);
    }
    .nav {
      display: flex;
      gap: 12px;
      margin-top: 26px;
      align-items: center;
    }
    .btn {
      appearance: none;
      border: 0;
      border-radius: 16px;
      padding: 15px 20px;
      min-height: 54px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      transition: transform .15s ease, opacity .15s ease, background .15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .btn-main {
      background: linear-gradient(180deg, #7c4f46, #5b362f);
      color: #fff7ef;
      flex: 1;
      box-shadow: 0 12px 22px rgba(91,54,47,.18);
    }
    .btn-sub {
      background: rgba(255,255,255,.56);
      color: var(--ink);
      border: 1px solid rgba(111,74,62,.16);
    }
    .btn-back {
      width: 56px;
      flex: none;
      padding: 0;
    }
    .info-card, .summary-card {
      margin-top: 20px;
      padding: 18px;
      border-radius: 20px;
      background: rgba(255,255,255,.34);
      border: 1px solid rgba(111,74,62,.14);
    }
    .event-meta {
      display: grid;
      gap: 8px;
      margin-top: 14px;
      color: rgba(47,29,25,.8);
      line-height: 1.55;
    }
    .event-link {
      display: inline-flex;
      margin-top: 14px;
      color: var(--rose);
      text-decoration: none;
      border-bottom: 1px solid rgba(157,77,92,.28);
      padding-bottom: 2px;
    }
    .poster-line {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .mini-poster {
      width: 82px;
      height: 116px;
      object-fit: cover;
      border-radius: 12px;
      border: 3px solid rgba(255,255,255,.66);
      box-shadow: 0 8px 18px rgba(0,0,0,.16);
    }
    .field,
    textarea,
    input[type="text"] {
      width: 100%;
      margin-top: 16px;
      border-radius: 18px;
      border: 1px solid rgba(111,74,62,.18);
      background: rgba(255,255,255,.54);
      padding: 15px 16px;
      color: var(--ink);
    }
    textarea { min-height: 132px; resize: vertical; line-height: 1.55; }
    .helper {
      margin-top: 10px;
      color: rgba(47,29,25,.66);
      font-size: 13px;
      line-height: 1.5;
    }
    .summary-list {
      display: grid;
      gap: 10px;
      margin-top: 16px;
      font-size: 15px;
    }
    .summary-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px dashed rgba(111,74,62,.18);
    }
    .summary-item:last-child { border-bottom: 0; padding-bottom: 0; }
    .summary-item strong { font-weight: 700; }
    .canvas-wrap {
      margin-top: 20px;
      padding: 14px;
      background: rgba(255,255,255,.4);
      border-radius: 22px;
      border: 1px solid rgba(111,74,62,.12);
    }
    canvas {
      width: 100%;
      display: block;
      border-radius: 18px;
      background: #f8efdf;
      box-shadow: 0 18px 34px rgba(44, 24, 20, .18);
    }
    .actions-grid {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }
    .footer-note {
      margin-top: 14px;
      color: rgba(255,255,255,.76);
      text-align: center;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(18px);
      z-index: 10;
      padding: 12px 16px;
      background: rgba(24,13,12,.92);
      color: #fff8f0;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      font-size: 14px;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    [hidden] { display: none !important; }
    @media (max-width: 640px) {
      .paper { padding: 20px; border-radius: 24px; background: rgba(252,245,234,.80); }
      .nav { flex-wrap: wrap; }
      .btn-main { width: 100%; }
      .btn-back { order: 2; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .question-art { width: 72px; height: 72px; font-size: 34px; }
      .choice-title { font-size: 16px; }
      .subtitle { font-size: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="cinema-bg" id="bg"></div>
  <button class="music-btn" id="musicToggle" type="button">♪ Включить музыку</button>
  <audio id="audio" src="assets/audio/music.mp3" loop preload="metadata"></audio>

  <main class="layout">
    <div class="shell">
      <section class="paper">
        <div id="app"></div>
      </section>
      
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const EVENT_LINK = 'https://kharkiv.internet-bilet.ua/uk/mozhe-buti-imperiya-angeliv';
    const ASSETS = {
      backgrounds: [
        'assets/images/bg01.jpg',
        'assets/images/bg02.jpg',
        'assets/images/bg03.jpg',
        'assets/images/bg04.jpg',
        'assets/images/bg05.jpg',
        'assets/images/bg06.jpg'
      ],
      poster: 'assets/images/event-cover.jpg',
      movieCollage: 'assets/images/movie-collage.jpg',
      handsPhoto: 'assets/images/hands-bracelets.png'
    };

    const OPTIONS = {
      moodStart: [
        { value: 'tired-angry', emoji: '😵', title: 'устала, злая, хочуц спать, работы куча', sub: '' },
        { value: 'okay', emoji: '🙂', title: 'терпимо, все получится', sub: '' },
        { value: 'better-than-thought', emoji: '☺️', title: 'лучше, чем думала', sub: '' },
        { value: 'great', emoji: '😌', title: 'отличное, прекрасно', sub: '' }
      ],
      future: [
        { value: 'yes', emoji: '💌', title: 'Да', sub: '' },
        { value: 'maybe', emoji: '🤍', title: 'Пока не знаю', sub: '' }
      ],
      meetTime: [
        { value: '15:00', emoji: '🕒', title: '15', sub: '' },
        { value: '16:00', emoji: '🕓', title: '16', sub: '' },
        { value: '17:00', emoji: '🕔', title: '17', sub: '' },
        { value: 'theatre', emoji: '🎭', title: 'у театра в 17:50', sub: '' }
      ],
      eat: [
        { value: 'yes', emoji: '🍽️', title: 'Да', sub: '' },
        { value: 'no', emoji: '🚶', title: 'Нет', sub: '' }
      ],
      place: [
        { value: 'mao', emoji: '🥢', title: 'Мао', sub: '' },
        { value: 'true-price', emoji: '🍲', title: 'Тру прайс', sub: '' },
        { value: 'custom', emoji: '✍️', title: 'Свой выбор', sub: '' },
        { value: 'secret', emoji: '🗝️', title: 'Секретное место', sub: '' }
      ],
      clothes: [
        { value: 'formal', emoji: '👗', title: 'Формальная', sub: 'рубашки, платья, блеск, все в обмороке' },
        { value: 'casual', emoji: '🧥', title: 'Повседневная', sub: 'легко и удобно' }
      ],
      gift: [
        { value: 'tasty', emoji: '🍫', title: 'Вкусный', sub: '' },
        { value: 'beautiful', emoji: '🌹', title: 'Красивый', sub: '' },
        { value: 'minimal', emoji: '🎁', title: 'Минималистичный', sub: '' },
        { value: 'favorit', emoji: '🤷', title: '“Ну он же тебя покупает, думай, думай”', sub: '' }
      ],
      moodEnd: [
        { value: 'less-murder', emoji: '😊', title: 'Уже не так хочется кого-то прибить', sub: '' },
        { value: 'intrigued-now', emoji: '😉', title: 'заинтриговал', sub: '' },
        { value: 'much-better', emoji: '😄', title: 'намного лучше', sub: '' },
        { value: 'all', emoji: '✨', title: 'все сразу', sub: '' }
      ]
    };

    const state = {
      moodStart: '',
      future: '',
      meetTime: '',
      eat: '',
      place: '',
      customPlace: '',
      clothes: '',
      palette: '',
      gift: '',
      moodEnd: '',
      note: ''
    };

    const app = document.getElementById('app');
    const bg = document.getElementById('bg');
    const audio = document.getElementById('audio');
    const musicToggle = document.getElementById('musicToggle');
    let currentIndex = 0;
    let toastTimer = 0;

    const STEP_BACKGROUNDS = {
      mood1: 0,
      future: 1,
      event: 2,
      meetTime: 3,
      eat: 4,
      place: 5,
      clothes: 1,
      palette: 2,
      gift: 3,
      mood2: 4,
      message: 5,
      finish: 0
    };

    function steps() {
      const out = ['mood1', 'future', 'event', 'meetTime'];
      if (state.meetTime && state.meetTime !== 'theatre') {
        out.push('eat');
        if (state.eat === 'yes') out.push('place');
      }
      out.push('clothes');
      if (state.clothes === 'formal') out.push('palette');
      out.push('gift', 'mood2', 'message', 'finish');
      return out;
    }

    function currentStep() {
      const visible = steps();
      if (currentIndex > visible.length - 1) currentIndex = visible.length - 1;
      return visible[currentIndex];
    }

    function esc(value) {
      return String(value).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
    }

    function toast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }

    function setBackground() {
      const step = currentStep();
      const index = STEP_BACKGROUNDS[step] ?? 0;
      bg.style.setProperty('--bg-image', `url("${ASSETS.backgrounds[index]}")`);
    }

    function progress() {
      const visible = steps();
      return {
        current: currentIndex + 1,
        total: visible.length,
        percent: ((currentIndex + 1) / visible.length) * 100
      };
    }

    function frame(chip, title, subtitle) {
      const p = progress();
      return `
        <div class="topbar">
          <div>Письмо о далёком будущем</div>
          <div>${p.current} / ${p.total}</div>
        </div>
        <div class="progress"><span style="width:${p.percent}%"></span></div>
        <div class="eyebrow">${chip}</div>
        <div class="question-art" aria-hidden="true">${title.emoji}</div>
        <h1>${title.text}</h1>
        <p class="subtitle">${subtitle}</p>
      `;
    }

    function renderChoiceStep({ id, chip, emoji, title, subtitle, options, nextLabel = 'Дальше' }) {
      const selected = state[id];
      const choices = options.map(option => `
        <button class="choice ${selected === option.value ? 'active' : ''}" type="button" data-value="${esc(option.value)}">
          <span class="emoji">${option.emoji}</span>
          <span>
            <span class="choice-title">${esc(option.title)}</span>
            ${option.sub ? `<span class="choice-sub">${esc(option.sub)}</span>` : ''}
          </span>
          <span class="check">✓</span>
        </button>
      `).join('');

      app.innerHTML = `
        ${frame(chip, { emoji, text: title }, subtitle)}
        <div class="choices">${choices}</div>
        <div class="nav">
          ${currentIndex > 0 ? '<button class="btn btn-sub btn-back" type="button" id="back">←</button>' : ''}
          <button class="btn btn-main" type="button" id="next" ${selected ? '' : 'disabled'}>${nextLabel}</button>
        </div>
      `;

      app.querySelectorAll('[data-value]').forEach(btn => {
        btn.addEventListener('click', () => {
          state[id] = btn.dataset.value;
          if (id === 'meetTime' && state.meetTime === 'theatre') {
            state.eat = '';
            state.place = '';
            state.customPlace = '';
          }
          if (id === 'meetTime' && state.meetTime !== 'theatre') {
            state.eat = '';
            state.place = '';
            state.customPlace = '';
          }
          if (id === 'eat' && state.eat !== 'yes') {
            state.place = '';
            state.customPlace = '';
          }
          if (id === 'clothes' && state.clothes !== 'formal') state.palette = '';
          render();
        });
      });

      bindNav({ nextLabel });
    }

    function bindNav({ validate } = {}) {
      const back = document.getElementById('back');
      const next = document.getElementById('next');
      if (back) back.addEventListener('click', () => {
        if (currentIndex > 0) {
          currentIndex -= 1;
          render();
        }
      });
      if (next) next.addEventListener('click', () => {
        if (validate && !validate()) return;
        currentIndex += 1;
        render();
      });
    }

    function renderEvent() {
      app.innerHTML = `
        ${frame('Времяпровождение', { emoji: '🎟️', text: 'Небольшой план на 18 ноября' }, 'Мне кажется, я смотрел этот спектакль лет 10 назад и потом хотел пересмотреть. Пойдешь со мной?)')}
        <div class="info-card">
          <h3>«Империя ангелов»</h3>
          <div class="event-meta">
            <div><strong>Дата:</strong> 18 ноября, среда</div>
            <div><strong>Начало:</strong> 18:00</div>
            <div><strong>Место:</strong> Театрально-концертный центр, Харьков</div>
            <div><strong>Коротко:</strong> трагикомическая постановка по мотивам романа Бернара Вербера.</div>
          </div>
          <a class="event-link" href="${EVENT_LINK}" target="_blank" rel="noopener noreferrer">Открыть страницу спектакля</a>
          <div class="poster-line">
            <img class="mini-poster" src="${ASSETS.poster}" alt="Обложка Империя ангелов" />
            <div class="helper">Ссылка остаётся кликабельной, так что при желании можно посмотреть детали события отдельно.</div>
          </div>
        </div>
        <div class="nav">
          <button class="btn btn-sub btn-back" type="button" id="back">←</button>
          <button class="btn btn-main" type="button" id="next">Дальше</button>
        </div>
      `;
      bindNav();
    }

    function renderPlace() {
      const selected = state.place;
      const choices = OPTIONS.place.map(option => `
        <button class="choice ${selected === option.value ? 'active' : ''}" type="button" data-value="${esc(option.value)}">
          <span class="emoji">${option.emoji}</span>
          <span>
            <span class="choice-title">${esc(option.title)}</span>
            ${option.sub ? `<span class="choice-sub">${esc(option.sub)}</span>` : ''}
          </span>
          <span class="check">✓</span>
        </button>
      `).join('');
      const needsCustom = state.place === 'custom';
      app.innerHTML = `
        ${frame('До спектакля', { emoji: '🍷', text: 'Если да, то место?' }, 'Выбери вариант ниже. Если нужен свой, можно вписать его отдельно.')}
        <div class="choices">${choices}</div>
        ${needsCustom ? `
          <input type="text" id="customPlace" class="field" maxlength="100" placeholder="Напиши своё место" value="${esc(state.customPlace)}" />
        ` : ''}
        <div class="nav">
          <button class="btn btn-sub btn-back" type="button" id="back">←</button>
          <button class="btn btn-main" type="button" id="next" ${!selected || (needsCustom && !state.customPlace.trim()) ? 'disabled' : ''}>Дальше</button>
        </div>
      `;

      app.querySelectorAll('[data-value]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.place = btn.dataset.value;
          if (state.place !== 'custom') state.customPlace = '';
          render();
        });
      });

      const input = document.getElementById('customPlace');
      if (input) {
        input.addEventListener('input', () => {
          state.customPlace = input.value;
          const next = document.getElementById('next');
          if (next) next.disabled = !state.customPlace.trim();
        });
      }
      bindNav({
        validate: () => {
          if (state.place === 'custom' && !state.customPlace.trim()) {
            toast('Нужно вписать своё место.');
            return false;
          }
          return true;
        }
      });
    }

    function renderPalette() {
      app.innerHTML = `
        ${frame('Дресс-код', { emoji: '🎨', text: 'Цветовая гамма' }, 'Скажи, что мне нужно, чтобы подчеркивать тебя) Я раздобуду)')}
        <input type="text" id="palette" class="field" maxlength="120" placeholder="Например: чёрный, бордо, тёплые оттенки" value="${esc(state.palette)}" />
        <div class="nav">
          <button class="btn btn-sub btn-back" type="button" id="back">←</button>
          <button class="btn btn-main" type="button" id="next">Дальше</button>
        </div>
      `;
      const input = document.getElementById('palette');
      input.addEventListener('input', () => state.palette = input.value);
      bindNav();
    }

    function renderMessage() {
      app.innerHTML = `
        ${frame('Последний штрих', { emoji: '✍️', text: 'Что-то от себя' }, 'впечатления, пожелания, угрозы?')}
        <textarea id="note" placeholder="Напиши что-нибудь от себя">${esc(state.note)}</textarea>
        <div class="nav">
          <button class="btn btn-sub btn-back" type="button" id="back">←</button>
          <button class="btn btn-main" type="button" id="next">Собрать коллаж</button>
        </div>
      `;
      const area = document.getElementById('note');
      area.addEventListener('input', () => state.note = area.value);
      bindNav();
    }

    function moodLabel(type, value) {
      if (type === 'moodEnd' && value === 'all') {
        return 'Уже не так хочется кого-то прибить, заинтриговал, намного лучше';
      }
      const found = OPTIONS[type].find(item => item.value === value);
      return found ? found.title : '—';
    }
    function giftLabel() { return moodLabel('gift', state.gift); }
    function placeLabel() {
      if (!state.place) return '—';
      if (state.place === 'custom') return state.customPlace || 'Свой выбор';
      const found = OPTIONS.place.find(item => item.value === state.place);
      return found ? found.title : '—';
    }
    function clothesLabel() { return moodLabel('clothes', state.clothes); }
    function futureLabel() { return moodLabel('future', state.future); }
    function eatLabel() { return state.meetTime === 'theatre' ? 'Сразу у театра' : moodLabel('eat', state.eat); }

    function summaryHTML() {
      return `
        <div class="summary-list">
          <div class="summary-item"><span><strong>Встреча</strong></span><span>${esc(state.meetTime === 'theatre' ? 'У театра в 17:50' : state.meetTime || '—')}</span></div>
          <div class="summary-item"><span><strong>Настроение теперь</strong></span><span>${esc(moodLabel('moodEnd', state.moodEnd))}</span></div>
          ${state.note.trim() ? `<div class="summary-item"><span><strong>Что-то от себя</strong></span><span style="white-space:pre-wrap;overflow-wrap:anywhere;text-align:right">${esc(state.note.trim())}</span></div>` : ''}
        </div>
      `;
    }

    function renderFinish() {
      app.innerHTML = `
        ${frame('Финал', { emoji: '🖼️', text: 'Готовая открытка' }, 'Её можно скачать или отправить через системное меню «Поделиться».')}
        <div class="summary-card">
          <h3>Краткий итог</h3>
          ${summaryHTML()}
        </div>
        <div class="canvas-wrap">
          <canvas id="collageCanvas" width="1300" height="2450" aria-label="Финальный коллаж"></canvas>
        </div>
        <div class="actions-grid">
          <button class="btn btn-main" type="button" id="download" disabled>Скачать коллаж</button>
          <button class="btn btn-sub" type="button" id="share" disabled>Поделиться</button>
          <button class="btn btn-sub" type="button" id="restart">Пройти заново</button>
        </div>
        <div class="nav">
          <button class="btn btn-sub btn-back" type="button" id="back">←</button>
        </div>
      `;
      bindFinishActions();
      requestAnimationFrame(drawCollage);
    }

    function validateCurrent(step) {
      switch (step) {
        case 'mood1': return !!state.moodStart;
        case 'future': return !!state.future;
        case 'event': return true;
        case 'meetTime': return !!state.meetTime;
        case 'eat': return !!state.eat;
        case 'place': return !!state.place && (state.place !== 'custom' || !!state.customPlace.trim());
        case 'clothes': return !!state.clothes;
        case 'palette': return true;
        case 'gift': return !!state.gift;
        case 'mood2': return !!state.moodEnd;
        case 'message': return true;
        case 'finish': return true;
        default: return true;
      }
    }

    function render() {
      setBackground();
      const step = currentStep();
      document.querySelector('.shell').classList.toggle('final-wide', step === 'finish');
      switch (step) {
        case 'mood1':
          renderChoiceStep({
            id: 'moodStart',
            chip: 'Привет, Лена)',
            emoji: '💭',
            title: 'Посмотрим какое сейчас настроение',
            subtitle: 'Увидел идею - сделал) Для начала оценим с чем имеем дело)',
            options: OPTIONS.moodStart
          });
          break;
        case 'future':
          renderChoiceStep({
            id: 'future',
            chip: 'Письмо о далёком будущем',
            emoji: '💌',
            title: 'Письмо о далёком будущем — 18 ноября',
            subtitle: 'Готова запланировать вечер среды 18 ноября? В любом случае читаем дальше.',
            options: OPTIONS.future
          });
          break;
        case 'event':
          renderEvent();
          break;
        case 'meetTime':
          renderChoiceStep({
            id: 'meetTime',
            chip: 'Организация вечера',
            emoji: '🕰️',
            title: 'Во сколько встретиться?',
            subtitle: 'Если встретимся пораньше - успеем больше)',
            options: OPTIONS.meetTime
          });
          break;
        case 'eat':
          renderChoiceStep({
            id: 'eat',
            chip: 'До спектакля',
            emoji: '🍽️',
            title: 'Хочешь зайти покушать до спектакля?',
            subtitle: '',
            options: OPTIONS.eat
          });
          break;
        case 'place':
          renderPlace();
          break;
        case 'clothes':
          renderChoiceStep({
            id: 'clothes',
            chip: 'Дресс-код',
            emoji: '👔',
            title: 'Что по одежде?',
            subtitle: 'будем понтоваться или по простому?)',
            options: OPTIONS.clothes
          });
          { const nav = app.querySelector('.nav'); if (nav) nav.insertAdjacentHTML('beforebegin', '<p class="helper">Ты красивая всегда)</p>'); }
          break;
        case 'palette':
          renderPalette();
          break;
        case 'gift':
          renderChoiceStep({
            id: 'gift',
            chip: 'Подарок от фаворита',
            emoji: '🎁',
            title: 'Какой вариант подарка ближе?',
            subtitle: '',
            options: OPTIONS.gift
          });
          { const nav = app.querySelector('.nav'); if (nav) nav.insertAdjacentHTML('beforebegin', '<p class="helper">Я все равно что-то притащу)</p>'); }
          break;
        case 'mood2':
          renderChoiceStep({
            id: 'moodEnd',
            chip: 'После всего этого',
            emoji: '✨',
            title: 'Настроение теперь?',
            subtitle: 'улучшилось?)',
            options: OPTIONS.moodEnd
          });
          { const nav = app.querySelector('.nav'); if (nav) nav.insertAdjacentHTML('beforebegin', '<p class="helper">Сам себя не похвалишь - никто не похвалит</p>'); }
          break;
        case 'message':
          renderMessage();
          break;
        case 'finish':
          renderFinish();
          break;
      }
    }

    function roundedRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function wrapCanvasLines(ctx, text, maxWidth) {
      const paragraphs = String(text || '').replace(/\r\n?/g, '\n').split('\n');
      const result = [];
      for (const paragraph of paragraphs) {
        const words = paragraph.trim().split(/\s+/).filter(Boolean);
        if (!words.length) { result.push(''); continue; }
        let line = '';
        for (let word of words) {
          if (ctx.measureText(word).width > maxWidth) {
            if (line) { result.push(line); line = ''; }
            let portion = '';
            for (const char of word) {
              if (portion && ctx.measureText(portion + char).width > maxWidth) {
                result.push(portion);
                portion = char;
              } else portion += char;
            }
            line = portion;
            continue;
          }
          if (line && ctx.measureText(line + ' ' + word).width > maxWidth) {
            result.push(line);
            line = word;
          } else line = line ? `${line} ${word}` : word;
        }
        if (line) result.push(line);
      }
      return result;
    }

    function printCanvasLines(ctx, lines, x, y, lineHeight) {
      lines.forEach((line, i) => ctx.fillText(line, x, y + i * lineHeight));
      return y + lines.length * lineHeight;
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    // Fit the entire source image into its rectangle; never crop it.
    function drawContainedImage(ctx, img, rect, bg = '#eee2d2') {
      roundedRect(ctx, rect.x, rect.y, rect.w, rect.h, 24);
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.save();
      roundedRect(ctx, rect.x, rect.y, rect.w, rect.h, 24);
      ctx.clip();
      const ratio = Math.min(rect.w / img.width, rect.h / img.height);
      const w = img.width * ratio;
      const h = img.height * ratio;
      ctx.drawImage(img, rect.x + (rect.w - w) / 2, rect.y + (rect.h - h) / 2, w, h);
      ctx.restore();
      ctx.strokeStyle = 'rgba(111,74,62,0.18)';
      ctx.lineWidth = 2;
      roundedRect(ctx, rect.x, rect.y, rect.w, rect.h, 24);
      ctx.stroke();
    }

    async function drawCollage() {
      const canvas = document.getElementById('collageCanvas');
      if (!canvas) return;
      const [bgImg, handsImg, movieCollage] = await Promise.all([
        loadImage(ASSETS.backgrounds[0]),
        loadImage(ASSETS.handsPhoto),
        loadImage(ASSETS.movieCollage)
      ]);
      // A dynamic PNG height prevents long free-text replies from being cut off.
      const ctx = canvas.getContext('2d');
      const x = 90, contentWidth = 1120;
      ctx.font = 'italic 33px Georgia';
      const phrase1 = wrapCanvasLines(ctx, 'Надеюсь, что ты будешь махать рукой!', contentWidth);
      const phrase2 = wrapCanvasLines(ctx, 'И все это можно назвать как угодно - изберательной вселенной, сродными душами, кармой. Главное, что это очень приятно)', contentWidth);
      let y = 310 + phrase1.length * 45 + 15 + phrase2.length * 45 + 24;
      const handRect = { x: 90, y, w: 1120, h: 650 };
      y = handRect.y + handRect.h + 54;
      const answerRows = [
        ['Встреча', state.meetTime === 'theatre' ? 'У театра в 17:50' : (state.meetTime || '—')],
        ['Настроение теперь', moodLabel('moodEnd', state.moodEnd)],
        ...(state.note.trim() ? [['Что-то от себя', state.note.trim()]] : [])
      ];
      const rows = answerRows.map(([label, value]) => {
        ctx.font = '27px Georgia';
        const lines = wrapCanvasLines(ctx, value, contentWidth - 32);
        const height = 37 + lines.length * 37 + 26;
        const row = { label, lines, y, height };
        y += height;
        return row;
      });
      const movieRatio = movieCollage.height / movieCollage.width;
      const movieRect = { x: 90, y: y + 28, w: 1120, h: Math.round(1120 * movieRatio) };
      const totalHeight = Math.ceil(movieRect.y + movieRect.h + 110);
      canvas.width = 1300;
      canvas.height = totalHeight;

      const ratio = Math.max(canvas.width / bgImg.width, canvas.height / bgImg.height);
      ctx.drawImage(bgImg, (canvas.width - bgImg.width * ratio) / 2,
        (canvas.height - bgImg.height * ratio) / 2,
        bgImg.width * ratio, bgImg.height * ratio);
      ctx.fillStyle = 'rgba(31,18,15,0.60)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      roundedRect(ctx, 38, 38, 1224, totalHeight - 76, 42);
      ctx.fillStyle = 'rgba(250,241,228,.97)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(111,74,62,0.20)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#8e4f5b';
      ctx.font = '28px Georgia';
      ctx.fillText('Письмо о далёком будущем', x, 116);
      ctx.fillStyle = '#2f1d19';
      ctx.font = 'bold 58px Georgia';
      ctx.fillText('18 ноября', x, 180);
      ctx.fillStyle = '#5f443b';
      ctx.font = '29px Georgia';
      ctx.fillText('Спектакль «Империя ангелов» · 18:00', x, 224);
      ctx.strokeStyle = 'rgba(111,74,62,0.18)';
      ctx.beginPath();
      ctx.moveTo(x, 248);
      ctx.lineTo(x + contentWidth, 248);
      ctx.stroke();

      ctx.fillStyle = '#3b241f';
      ctx.font = 'italic 33px Georgia';
      let textY = 310;
      textY = printCanvasLines(ctx, phrase1, x, textY, 45) + 15;
      printCanvasLines(ctx, phrase2, x, textY, 45);
      drawContainedImage(ctx, handsImg, handRect);

      for (const row of rows) {
        ctx.fillStyle = '#8e4f5b';
        ctx.font = 'bold 25px Georgia';
        ctx.fillText(row.label, x, row.y);
        ctx.fillStyle = '#291b17';
        ctx.font = '27px Georgia';
        printCanvasLines(ctx, row.lines, x, row.y + 42, 37);
        ctx.strokeStyle = 'rgba(111,74,62,0.16)';
        ctx.beginPath();
        ctx.moveTo(x, row.y + row.height - 13);
        ctx.lineTo(x + contentWidth, row.y + row.height - 13);
        ctx.stroke();
      }
      drawContainedImage(ctx, movieCollage, movieRect);
      const downloadButton = document.getElementById('download');
      const shareButton = document.getElementById('share');
      if (downloadButton) downloadButton.disabled = false;
      if (shareButton) shareButton.disabled = false;
    }

    function downloadCanvas() {
      const canvas = document.getElementById('collageCanvas');
      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/png');
      link.download = 'retro-invite-collage.png';
      link.click();
    }

    async function shareCanvas() {
      const canvas = document.getElementById('collageCanvas');
      if (!canvas) return;
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      if (!blob) return downloadCanvas();
      const file = new File([blob], 'retro-invite-collage.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
        try {
          await navigator.share({
            title: 'Письмо о далёком будущем — 18 ноября',
            text: 'Ретро-открытка со спектаклем и планом вечера.',
            files: [file]
          });
          return;
        } catch (error) {
          if (error?.name === 'AbortError') return;
        }
      }
      downloadCanvas();
      toast('Если меню "Поделиться" недоступно, файл уже можно скачать.');
    }

    function bindFinishActions() {
      document.getElementById('download').addEventListener('click', downloadCanvas);
      document.getElementById('share').addEventListener('click', shareCanvas);
      document.getElementById('restart').addEventListener('click', () => {
        state.moodStart = '';
        state.future = '';
        state.meetTime = '';
        state.eat = '';
        state.place = '';
        state.customPlace = '';
        state.clothes = '';
        state.palette = '';
        state.gift = '';
        state.moodEnd = '';
        state.note = '';
        currentIndex = 0;
        render();
      });
      document.getElementById('back').addEventListener('click', () => {
        if (currentIndex > 0) {
          currentIndex -= 1;
          render();
        }
      });
    }


    async function tryAutoplay() {
      try {
        audio.volume = 0.65;
        await audio.play();
        musicToggle.textContent = '❚❚ Выключить музыку';
      } catch (error) {
        musicToggle.textContent = '♪ Включить музыку';
      }
    }

    musicToggle.addEventListener('click', async () => {
      try {
        if (audio.paused) {
          await audio.play();
          musicToggle.textContent = '❚❚ Выключить музыку';
        } else {
          audio.pause();
          musicToggle.textContent = '♪ Включить музыку';
        }
      } catch (error) {
        toast('Не удалось включить музыку в этом браузере.');
      }
    });

    render();
    tryAutoplay();
  </script>
